<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Your Wallet</title>
<meta name="description" content="နေ့စဉ် သုံးငွေ မှတ်တမ်း — Daily spending tracker for Myanmar.">
<meta name="theme-color" content="#f7f3ea">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Your Wallet">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
@font-face{
  font-family:'Noto Sans Myanmar';
  src:url('fonts/NotoSansMyanmar-Regular.ttf') format('truetype');
  font-weight:400; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Noto Sans Myanmar';
  src:url('fonts/NotoSansMyanmar-Bold.ttf') format('truetype');
  font-weight:700; font-style:normal; font-display:swap;
}
/* Palette: deep navy + champagne gold on warm paper. The --green/--clay
   variable names are legacy — they now hold navy and gold. */
:root{
  --paper:#f7f3ea; --card:#fffdf6; --ink:#1a2233; --ink-soft:#5d6577;
  --line:#e5ddc9; --line-strong:#c9bfa4; --green:#1e3a5f; --green-soft:#e8ecf3;
  --green-ink:#16294a; --green-fill:#2c5282; --clay:#b08d3e; --warn:#8a5a1d; --warn-bg:#f6ecd8;
  --danger:#9a3226; --input-bg:#ffffff; --chip-bg:#f1ebdb;
  --shadow:0 1px 3px rgba(26,34,51,.07), 0 4px 14px rgba(26,34,51,.05);
  --shadow-lg:0 2px 6px rgba(26,34,51,.08), 0 10px 28px rgba(26,34,51,.09);
  --radius:14px;
  /* Liquid Glass recipe: frosted translucent surfaces over the aurora.
     Deliberately transparent — glass you cannot see through is not glass. */
  --glass-bg:linear-gradient(135deg, rgba(255,255,255,.42), rgba(255,255,255,.22));
  --glass-border:rgba(255,255,255,.65);
  --glass-border-strong:rgba(30,58,95,.30);
  --glass-hi:rgba(255,255,255,.8);
  --glass-shadow:0 10px 32px rgba(26,34,51,.14), inset 0 2px 1px rgba(255,255,255,.8), inset 0 -1px 1px rgba(255,255,255,.3), inset 1px 0 1px rgba(255,255,255,.3), inset -1px 0 1px rgba(255,255,255,.3);
  --card-glass:linear-gradient(135deg, rgba(255,253,246,.74), rgba(255,253,246,.62));
}
[data-theme="dark"]{
  --paper:#0e1622; --card:#16233a; --ink:#ece8dc; --ink-soft:#a8b0c2;
  --line:#2a3a52; --line-strong:#46587a; --green:#3d6a9e; --green-soft:#1a2a3f;
  --green-ink:#cbb489; --green-fill:#bfa065; --clay:#bfa065; --warn:#d9a55c; --warn-bg:#3a2f1c;
  --danger:#e08a7a; --input-bg:#0e1622; --chip-bg:#1e2c44;
  --shadow:0 1px 3px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  --shadow-lg:0 2px 6px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.3);
  --glass-bg:linear-gradient(135deg, rgba(60,85,130,.34), rgba(22,35,58,.22));
  --glass-border:rgba(255,255,255,.20);
  --glass-border-strong:rgba(255,255,255,.24);
  --glass-hi:rgba(255,255,255,.28);
  --glass-shadow:0 10px 32px rgba(0,0,0,.4), inset 0 2px 1px rgba(255,255,255,.28), inset 0 -1px 1px rgba(255,255,255,.1), inset 1px 0 1px rgba(255,255,255,.12), inset -1px 0 1px rgba(255,255,255,.12);
  --card-glass:linear-gradient(135deg, rgba(30,45,72,.64), rgba(22,35,58,.52));
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Noto Sans Myanmar','Noto Sans',sans-serif;
  font-size:16px; line-height:1.55;
  transition:background-color .45s ease, color .45s ease;
  /* App-like feel: no text selection or long-press callout on any text.
     Form fields re-enable selection below, so typing/paste still work. */
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
input, textarea{ -webkit-user-select:text; user-select:text; }
/* Ambient aurora behind everything — glass has something to refract.
   Strong and vivid on purpose: faint colour behind glass reads as flat.
   The blobs drift and breathe slowly, so the colour behind the glass
   keeps shifting — that motion is what makes the glass read as LIQUID
   instead of plain frosted glass. Transform-only animation: cheap. */
.aurora{position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;}
.aurora i{position:absolute; border-radius:50%; will-change:transform;}
/* Blobs live at the corners, not mid-screen: colour behind form fields
   and body text reads as stains, not ambience. */
.aurora .b1{width:600px; height:480px; right:-140px; top:-200px; background:radial-gradient(circle, rgba(212,175,106,.45), transparent 70%); animation:drift1 26s ease-in-out infinite alternate;}
.aurora .b2{width:680px; height:520px; left:-180px; top:-30%; background:radial-gradient(circle, rgba(44,82,130,.3), transparent 70%); animation:drift2 32s ease-in-out infinite alternate;}
.aurora .b3{width:560px; height:440px; right:-120px; top:70%; background:radial-gradient(circle, rgba(217,165,92,.45), transparent 70%); animation:drift3 24s ease-in-out infinite alternate;}
.aurora .b4{width:660px; height:500px; left:-160px; bottom:-140px; background:radial-gradient(circle, rgba(44,82,130,.4), transparent 70%); animation:drift4 30s ease-in-out infinite alternate;}
[data-theme="dark"] .aurora .b1{background:radial-gradient(circle, rgba(212,175,106,.35), transparent 70%);}
[data-theme="dark"] .aurora .b2{background:radial-gradient(circle, rgba(80,130,190,.5), transparent 70%);}
[data-theme="dark"] .aurora .b3{background:radial-gradient(circle, rgba(217,165,92,.28), transparent 70%);}
[data-theme="dark"] .aurora .b4{background:radial-gradient(circle, rgba(80,130,190,.38), transparent 70%);}
@keyframes drift1{from{transform:translate(0,0) scale(1);} to{transform:translate(-70px,60px) scale(1.15);}}
@keyframes drift2{from{transform:translate(0,0) scale(1.1);} to{transform:translate(80px,-50px) scale(.95);}}
@keyframes drift3{from{transform:translate(0,0) scale(1);} to{transform:translate(-60px,-70px) scale(1.2);}}
@keyframes drift4{from{transform:translate(0,0) scale(1);} to{transform:translate(70px,-60px) scale(1.1);}}
#app{max-width:560px; margin:0 auto; padding:14px 16px 110px;}
@keyframes viewEnter{from{opacity:.3; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.view-enter{animation:viewEnter .35s ease both;}
@keyframes fadeUp{from{opacity:.3; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
/* Day-page slide: arrow taps turn the page sideways. */
.day-slide-left{animation:slideLeft .4s cubic-bezier(.22,.9,.32,1) both;}
@keyframes slideLeft{from{opacity:.3; transform:translateX(28px);} to{opacity:1; transform:translateX(0);}}
.day-slide-right{animation:slideRight .4s cubic-bezier(.22,.9,.32,1) both;}
@keyframes slideRight{from{opacity:.3; transform:translateX(-28px);} to{opacity:1; transform:translateX(0);}}
.fade-up{animation:fadeUp .4s ease both;}
button{font-family:inherit; cursor:pointer; transition:transform .25s cubic-bezier(.34,1.56,.64,1), background .2s ease, border-color .2s ease, box-shadow .18s ease, color .2s ease;}
button:active{transform:translateY(-2px); box-shadow:0 8px 16px rgba(38,34,26,.18);}
/* Liquid Glass press: glass controls squash softly like iOS. */
.btn:active, .chip:active, .iconbtn:active, .langbtn:active, .arrow:active, .tabbar .tab:active{transform:scale(.93);}
.fab:active{transform:scale(.9);}
.name-ok:active{transform:scale(.88);}
.btn{
  border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--ink);
  -webkit-backdrop-filter:blur(18px) saturate(1.5); backdrop-filter:blur(18px) saturate(1.5);
  border-radius:10px; padding:9px 14px; font-size:14.5px; line-height:1.3; box-shadow:var(--glass-shadow);
}
.btn svg{width:17px; height:17px; vertical-align:-3px;}
.btn.primary{background:linear-gradient(135deg, rgba(30,58,95,.72), rgba(22,41,74,.62)); border-color:rgba(255,255,255,.28); color:#f7f3ea; font-weight:700;}
.btn.primary.big{width:100%; padding:14px; font-size:17px; border-radius:12px;}
.btn.danger{color:var(--danger); border-color:var(--danger);}
.btn.ghost{border-color:transparent; background:transparent; box-shadow:none; color:var(--green-ink);}
.btn.small{padding:6px 10px; font-size:13px;}
.iconbtn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--glass-border);
  background:var(--glass-bg); color:var(--ink-soft); display:inline-flex;
  -webkit-backdrop-filter:blur(18px) saturate(1.5); backdrop-filter:blur(18px) saturate(1.5);
  align-items:center; justify-content:center; box-shadow:var(--glass-shadow); flex-shrink:0;
}
.iconbtn svg{width:20px; height:20px;}
.iconbtn.on{color:var(--green-ink); border-color:var(--green);}
/* Language toggle: a pill sized to the text — "မြန်မာ" never fit the
   38px circle and overflowed its frame. */
.langbtn{
  min-width:56px; height:38px; padding:0 13px; border-radius:99px;
  border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--ink);
  -webkit-backdrop-filter:blur(18px) saturate(1.5); backdrop-filter:blur(18px) saturate(1.5);
  font-size:14px; font-weight:700; font-family:inherit;
  display:inline-flex; align-items:center; justify-content:center;
  box-shadow:var(--glass-shadow); flex-shrink:0;
}
/* ---------- header (user profile) ---------- */
header.top{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:4px 0 14px;}
.profile{display:flex; align-items:center; gap:10px; min-width:0; flex:1 1 auto;}
.avatar{width:42px; height:42px; border-radius:50%; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--ink-soft); overflow:hidden; flex-shrink:0; padding:0; box-shadow:var(--glass-shadow); display:inline-flex; align-items:center; justify-content:center; -webkit-backdrop-filter:blur(18px) saturate(1.5); backdrop-filter:blur(18px) saturate(1.5); transition:background-color .45s ease, border-color .45s ease;}
.avatar img{width:100%; height:100%; object-fit:cover; display:block;}
.avatar svg{width:24px; height:24px;}
.pname{font-weight:700; font-size:18px; letter-spacing:.2px; color:var(--green-ink); line-height:1.25; background:none; border:none; padding:4px 2px; text-align:left; max-width:150px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pname-input{font-size:17px; font-weight:700; font-family:inherit; color:var(--ink); background:var(--card-glass); border:1px solid rgba(176,141,62,.65); border-radius:10px; padding:6px 10px; outline:none; flex:1 1 auto; min-width:0; max-width:220px; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); transition:background-color .45s ease, color .45s ease;}
.name-ok{width:34px; height:34px; border-radius:50%; border:1px solid rgba(255,255,255,.28); background:linear-gradient(135deg, rgba(30,58,95,.72), rgba(22,41,74,.62)); color:#f7f3ea; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);}
.name-ok svg{width:18px; height:18px;}
.topbtns{display:flex; gap:8px; flex-shrink:0;}
/* Narrow phones (360px and below): the header row must never overflow —
   the name shrinks first, then the gaps and the language pill. */
@media (max-width:380px){
  header.top{gap:6px;}
  .profile{gap:8px;}
  .pname{max-width:110px;}
  .langbtn{min-width:48px; padding:0 10px;}
}
/* ---------- cards ---------- */
.card{background:var(--card-glass); border:1px solid var(--glass-border); border-radius:var(--radius); box-shadow:var(--glass-shadow); padding:16px; margin-bottom:16px; -webkit-backdrop-filter:blur(20px) saturate(1.5); backdrop-filter:blur(20px) saturate(1.5); transition:background-color .45s ease, box-shadow .2s ease, transform .18s ease;}
.card:active{transform:translateY(-2px); box-shadow:var(--shadow-lg);}
.card h3{margin:0 0 12px; font-size:15px; color:var(--green-ink); display:flex; justify-content:space-between; align-items:baseline;}
.card h3 .side{font-weight:400; font-size:13px; color:var(--ink-soft);}
/* ---------- balance (3D flip card) ---------- */
.balance-wrap{position:relative; overflow:hidden; border-radius:var(--radius); margin-bottom:16px; box-shadow:var(--shadow-lg); perspective:900px;}
.balance-flip{position:relative; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.4,0,.2,1);}
.balance-wrap.hidden .balance-flip{transform:rotateY(180deg);}
.balance{
  background:linear-gradient(135deg, rgba(14,34,64,.72), rgba(30,58,95,.62)); color:#f7f3ea; border-radius:var(--radius);
  border:1px solid rgba(255,255,255,.3);
  box-shadow:0 10px 32px rgba(26,34,51,.16), inset 0 2px 1px rgba(255,255,255,.35), inset 0 -1px 1px rgba(255,255,255,.15);
  padding:18px 18px 16px; cursor:pointer; position:relative;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  transition:background-color .45s ease;
}
/* No backdrop-filter on the flip faces: it can glitch with
   backface-visibility mid-flip. Translucency + rim + sheen carry the glass. */
/* The sheen is a soft band that sweeps slowly across the card and back —
   light glinting over glass, not a fixed stripe. 8s each way, so it
   never feels busy. Clipped by .balance-wrap's overflow:hidden. */
.balance::after, .balance-cover::after{content:''; position:absolute; top:0; bottom:0; left:-40%; width:40%; pointer-events:none;
  background:linear-gradient(115deg, transparent, rgba(255,255,255,.20) 40%, rgba(255,255,255,.06) 60%, transparent);
  animation:sheenSweep 8s ease-in-out infinite alternate;}
@keyframes sheenSweep{from{transform:translateX(0);} to{transform:translateX(350%);}}
.balance .top{display:flex; justify-content:space-between; align-items:center;}
.balance .lbl{font-size:13px; opacity:.85;}
.balance .eye, .balance-cover .eye{width:34px; height:34px; border-radius:50%; border:1px solid rgba(247,243,234,.35); background:transparent; color:#f7f3ea; display:inline-flex; align-items:center; justify-content:center; position:relative; z-index:1;}
.balance .eye svg, .balance-cover .eye svg{width:19px; height:19px;}
.balance .amt{font-size:36px; font-weight:700; line-height:1.15; margin-top:2px;}
.balance .sub{font-size:13px; opacity:.85; margin-top:6px; line-height:1.5;}
.balance-cover{
  position:absolute; inset:0; border-radius:var(--radius); overflow:hidden;
  transform:rotateY(180deg); cursor:pointer;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:linear-gradient(135deg, rgba(10,22,38,.78), rgba(18,42,69,.68) 55%, rgba(30,58,95,.62));
  border:1px solid rgba(255,255,255,.3);
  box-shadow:0 10px 32px rgba(26,34,51,.16), inset 0 2px 1px rgba(255,255,255,.35), inset 0 -1px 1px rgba(255,255,255,.15);
  display:flex; align-items:center; justify-content:center;
}
.balance-cover svg{width:56px; height:56px; color:#d4af6a;}
.balance-cover .eye{position:absolute; top:12px; right:12px; background:rgba(10,18,32,.55); border-color:rgba(247,243,234,.45);}
/* ---------- budget bar ---------- */
@keyframes barIn{from{width:0;}}
.budgetbar{height:12px; background:var(--chip-bg); border-radius:99px; overflow:hidden;}
.budgetbar .fill{height:100%; background:var(--green-fill); border-radius:99px; animation:barIn .8s ease both;}
.budgetbar .fill.over{background:var(--danger);}
.budgetrow{display:flex; justify-content:space-between; font-size:13.5px; color:var(--ink-soft); margin-top:8px;}
.budgetrow b{color:var(--ink);}
.statgrid{display:flex; gap:10px; margin-top:14px;}
.stat{flex:1; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:10px; padding:10px 12px; box-shadow:var(--glass-shadow); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); transition:background-color .45s ease, box-shadow .2s ease, transform .18s ease;}
.stat:active{transform:translateY(-2px); box-shadow:var(--shadow-lg);}
.stat .v{font-size:17px; font-weight:700; color:var(--green-ink);}
.stat .k{font-size:12px; color:var(--ink-soft);}
.stat .s{font-size:12px; color:var(--ink-soft); margin-top:2px;}
/* ---------- donut ---------- */
@keyframes donutIn{from{opacity:0; transform:rotate(-30deg) scale(.94);} to{opacity:1; transform:rotate(0) scale(1);}}
.donut-wrap{display:flex; gap:16px; align-items:center;}
.donut{animation:donutIn .7s ease both; flex-shrink:0;}
.legend{flex:1; min-width:0;}
.legend .row{display:flex; align-items:center; gap:8px; padding:5px 0; font-size:13.5px;}
.legend .dot{width:10px; height:10px; border-radius:3px; flex-shrink:0;}
.legend .nm{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.legend .am{font-weight:700;}
.legend .pc{color:var(--ink-soft); font-size:12px; width:34px; text-align:right;}
.empty{color:var(--ink-soft); font-size:14px; text-align:center; padding:14px 0;}
/* ---------- bars ---------- */
@keyframes barGrow{from{transform:scaleY(0);} to{transform:scaleY(1);}}
.bar-chart{display:flex; align-items:flex-end; gap:8px; height:120px; padding-top:6px;}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end;}
.bar-col .bar{width:100%; max-width:34px; background:var(--green-fill); border-radius:6px 6px 3px 3px; opacity:.75; transform-origin:bottom; animation:barGrow .6s ease both;}
.bar-col.today .bar{opacity:1; background:var(--green);}
.bar-col .bv{font-size:11px; color:var(--ink-soft); line-height:1;}
.bar-col .bl{font-size:12px; color:var(--ink-soft);}
.bar-col.today .bl{color:var(--green-ink); font-weight:700;}
/* ---------- activity ---------- */
.actrow{display:flex; align-items:center; gap:11px; padding:10px 0; border-bottom:1px solid var(--line);}
.actrow:last-child{border-bottom:none;}
.catic{width:38px; height:38px; border-radius:11px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
.catic svg{width:20px; height:20px;}
.actrow .mid{flex:1; min-width:0;}
.actrow .nm{font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.actrow .dt{font-size:12px; color:var(--ink-soft);}
.actrow .am{font-weight:700; font-size:15px; white-space:nowrap;}
.actrow .am.inc{color:var(--green-fill);}
/* ---------- day view / ledger ---------- */
.datenav{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px;}
.datenav .d{text-align:center; flex:1;}
.datenav .d .date{font-size:19px; font-weight:700;}
.datenav .d .wd{font-size:13px; color:var(--ink-soft);}
.arrow{width:42px; height:42px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--ink); border-radius:12px; box-shadow:var(--glass-shadow); flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; -webkit-backdrop-filter:blur(18px) saturate(1.5); backdrop-filter:blur(18px) saturate(1.5);}
.arrow svg{width:20px; height:20px;}
.search{position:relative; margin-bottom:14px;}
.search input{
  width:100%; padding:11px 13px; font-size:15px; font-family:inherit; color:var(--ink);
  background:var(--card-glass); border:1px solid var(--glass-border-strong); border-radius:12px; outline:none;
  -webkit-backdrop-filter:blur(18px) saturate(1.5); backdrop-filter:blur(18px) saturate(1.5);
  box-shadow:inset 0 1px 0 var(--glass-hi);
  transition:background-color .45s ease, color .45s ease, border-color .2s ease, box-shadow .2s ease;
}
.search input:focus{border-color:rgba(176,141,62,.7); box-shadow:inset 0 1px 0 var(--glass-hi), 0 0 0 3px rgba(212,175,106,.25);}
.suggest{
  position:absolute; left:0; right:0; top:100%; z-index:20; background:var(--card);
  border:1px solid var(--line-strong); border-top:none; border-radius:0 0 12px 12px; box-shadow:var(--shadow);
}
.suggest button{display:block; width:100%; text-align:left; background:none; border:none; border-top:1px solid var(--line); padding:11px 13px; font-size:15px; color:var(--ink);}
.suggest button:first-child{border-top:none;}
.suggest button:active{background:var(--green-soft);}
.suggest .none{padding:11px 13px; font-size:14px; color:var(--ink-soft);}
.chips{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 12px; scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
/* PC: the chips row has no visible scrollbar and no touch swipe, so a
   mouse user could never reach the last categories. On a fine-pointer
   device show a thin gold scrollbar and a grab cursor; the row is also
   mouse-draggable (see initChipDrag). Touch keeps the hidden bar. */
@media (hover:hover) and (pointer:fine){
  .chips{scrollbar-width:thin; scrollbar-color:rgba(176,141,62,.55) transparent; cursor:grab;}
  .chips::-webkit-scrollbar{display:block; height:6px;}
  .chips::-webkit-scrollbar-thumb{background:rgba(176,141,62,.55); border-radius:3px;}
  .chips::-webkit-scrollbar-track{background:transparent;}
  .chips.dragging{cursor:grabbing;}
}
.chip{
  display:inline-flex; align-items:center; gap:7px; flex-shrink:0;
  border:1px solid var(--glass-border-strong); background:var(--glass-bg); color:var(--ink);
  -webkit-backdrop-filter:blur(18px) saturate(1.5); backdrop-filter:blur(18px) saturate(1.5);
  border-radius:99px; padding:8px 13px 8px 9px; font-size:14px; box-shadow:var(--glass-shadow);
}
.chip .catic{width:26px; height:26px; border-radius:50%;}
.chip .catic svg{width:15px; height:15px;}
.chip.active{border-color:rgba(176,141,62,.65); color:var(--clay); background:linear-gradient(135deg, rgba(212,175,106,.4), rgba(176,141,62,.26));}
/* The day view composes one entry at a time: chip -> draft -> Save. */
.draft-row{margin-bottom:14px;}
.draft-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.draft-head .nm{flex:1; font-size:16px; font-weight:700;}
.draft-x{border:none; background:none; color:var(--ink-soft); font-size:22px; padding:2px 4px; line-height:1;}

  width:46%; text-align:right; font-size:17px; font-weight:700; font-family:inherit; color:var(--ink);
  background:var(--card-glass); border:1px solid var(--glass-border-strong); border-radius:10px; padding:10px; outline:none;
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 var(--glass-hi);
}
.draft-fields input[type=number]:focus{border-color:rgba(176,141,62,.7); box-shadow:inset 0 1px 0 var(--glass-hi), 0 0 0 3px rgba(212,175,106,.25);}
.draft-fields .note-in{
  flex:1; min-width:0; font-size:14px; font-family:inherit; color:var(--ink);
  background:var(--card-glass); border:1px solid var(--glass-border-strong); border-radius:10px; padding:10px; outline:none;
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 var(--glass-hi);
}
.draft-fields .note-in:focus{border-color:rgba(176,141,62,.7); box-shadow:inset 0 1px 0 var(--glass-hi), 0 0 0 3px rgba(212,175,106,.25);}
/* On save, the draft bursts into soft petals that drift down and away
   like falling leaves — a slow, visible moment, not a quick pop. Each
   petal sways side to side, spins as it falls, and fades out. */
@keyframes petalFall{
  0%{transform:translate(0,0) rotate(0deg) scale(1); opacity:1;}
  20%{transform:translate(var(--dx1),10px) rotate(var(--r1)) scale(1); opacity:1;}
  55%{transform:translate(var(--dx2),72px) rotate(var(--r2)) scale(.85); opacity:.85;}
  100%{transform:translate(var(--dx3),150px) rotate(var(--r3)) scale(.35); opacity:0;}
}
.burst-dot{
  position:fixed; border-radius:50% 0 50% 50%; pointer-events:none; z-index:9999;
  animation:petalFall 1.1s cubic-bezier(.3,.6,.4,1) forwards;
}
/* The draft row itself sinks and fades as the petals fall. animation:none
   kills the .fade-up fill, which would otherwise pin it in place. */
.draft-row.leaving{animation:none; transition:transform .42s ease, opacity .42s ease; transform:translateY(14px) scale(.97); opacity:0; pointer-events:none;}
/* Recent rows: a small trash bin at the end of each row. */
.actrow .trash{border:none; background:none; color:var(--ink-soft); padding:6px; margin:-6px -8px -6px 0; border-radius:8px; flex-shrink:0;}
.actrow .trash svg{width:18px; height:18px;}
.actrow .trash:active{color:var(--danger);}
/* Exit confirm: Yes and No are exactly equal. */
.exit-actions{display:flex; gap:8px;}
.exit-actions .btn{flex:1; padding:14px; font-size:17px; border-radius:12px;}
table.ledger{width:100%; border-collapse:collapse;}
table.ledger td{padding:11px 0; border-bottom:1px solid var(--line); vertical-align:middle;}
table.ledger tr:last-child td{border-bottom:none;}
table.ledger .ic{width:46px;}
table.ledger .nm{font-size:14.5px; font-weight:700; line-height:1.3;}
table.ledger .nt{font-size:12.5px; color:var(--ink-soft); line-height:1.3;}
table.ledger .am{width:118px; text-align:right;}
table.ledger .am input{
  width:100%; text-align:right; font-size:16px; font-weight:700; font-family:inherit; color:var(--ink);
  background:var(--input-bg); border:1px solid var(--line); border-radius:8px; padding:7px 9px; outline:none;
  transition:background-color .45s ease, color .45s ease, border-color .2s ease;
}
table.ledger .am input:focus{border-color:var(--green);}
table.ledger .am input.inc{color:var(--green-fill);}
table.ledger .del{width:34px; text-align:right;}
table.ledger .del button{border:none; background:none; color:var(--ink-soft); font-size:19px; padding:4px 2px;}
table.ledger .note-in{
  width:100%; font-size:13.5px; font-family:inherit; color:var(--ink);
  background:transparent; border:none; border-bottom:1px dashed var(--line-strong); padding:2px 0; outline:none;
}
.totalbar{border-top:2px solid var(--green); margin-top:6px; padding-top:12px;}
.totalbar .row{display:flex; justify-content:space-between; font-size:15px; padding:3px 0;}
.totalbar .row.big{font-size:18px; font-weight:700; color:var(--green-ink);}
.totalbar .row .rem{color:var(--green-fill); font-weight:700;}
/* ---------- setup ---------- */
.setup-hero{margin:6px 0 18px; border-radius:18px; overflow:hidden; box-shadow:var(--glass-shadow); border:1px solid rgba(255,255,255,.25);}
/* One flowing glass intro panel: logo, wordmark, gold rule, title, sub.
   Translucent navy, so the aurora glows through it instead of a hard
   solid block. */
.setup-hero .hero-brand{padding:28px 20px 24px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; background:linear-gradient(135deg, rgba(14,34,64,.66), rgba(30,58,95,.55)); color:#f7f3ea; -webkit-backdrop-filter:blur(20px) saturate(1.4); backdrop-filter:blur(20px) saturate(1.4); text-align:center; position:relative;}
.setup-hero .hero-brand::after{content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.14) 46%, rgba(255,255,255,.03) 54%, transparent 68%);}
.setup-hero .hero-brand svg{width:64px; height:64px; color:#d4af6a;}
.setup-hero .hero-brand .w{font-size:20px; font-weight:800; letter-spacing:1px;}
.setup-hero .hero-brand .rule{width:44px; height:2px; background:linear-gradient(90deg, transparent, #d4af6a, transparent); border-radius:2px; margin:4px 0;}
.setup-hero .hero-brand .t{font-size:20px; font-weight:700;}
.setup-hero .hero-brand .s{font-size:13px; opacity:.85;}
/* The form drifts in one field at a time, like an introduction.
   Scoped to .setup-view.intro: the class is only on the first render. */
.setup-view.intro .setup-form .field{animation:fadeUp .5s ease both;}
.setup-view.intro .setup-form .field:nth-child(2){animation-delay:.08s;}
.setup-view.intro .setup-form .field:nth-child(3){animation-delay:.16s;}
.setup-view.intro .agree-row{animation:fadeUp .5s .24s ease both;}

/* Login (v1.1.0): same navy/gold glass as setup, never the green/blue
   pills of the reference app. The hero panel is shared with setup. */
.login-card{background:var(--card-glass); border:1px solid var(--glass-border); border-radius:var(--radius); box-shadow:var(--glass-shadow); padding:18px; -webkit-backdrop-filter:blur(20px) saturate(1.5); backdrop-filter:blur(20px) saturate(1.5);}

.login-or em{font-style:normal;}
.oauth-btn{width:100%; margin-bottom:10px; display:flex; align-items:center; justify-content:center; gap:10px; padding:12px;}
.oauth-g,.oauth-f{width:26px; height:26px; border-radius:50%; background:#fff; color:#1a2233; font-weight:800; font-size:17px; line-height:26px; text-align:center; flex-shrink:0;}
.oauth-f{background:#1877f2; color:#fff;}
.login-guest{text-align:center; margin-top:6px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:13.5px; color:var(--ink); font-weight:600; margin-bottom:6px;}
.field input{

.field input:focus{border-color:rgba(176,141,62,.7); box-shadow:inset 0 1px 0 var(--glass-hi), 0 0 0 3px rgba(212,175,106,.25);}
.suggest-chip{

}
/* ---------- settings ---------- */
.setrow{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; margin-bottom:14px; transition:background-color .45s ease;}
.hint{font-size:13.5px; color:var(--ink-soft); line-height:1.55;}
/* ---------- budget explainer + first-run tour ---------- */
.whyrow{text-align:right; margin-top:2px;}
.whylink{background:none; border:none; padding:2px 0; font-size:12.5px; color:var(--green); text-decoration:underline; cursor:pointer; font-family:inherit;}
.whybox{background:var(--card-glass); border:1px solid var(--glass-border); border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.6; color:var(--ink); margin-top:6px; overflow:hidden; max-height:200px; opacity:1; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); transition:max-height .4s ease, opacity .3s ease, padding .4s ease, margin .4s ease, border-width .4s ease;}
.whybox.closed{max-height:0; opacity:0; padding-top:0; padding-bottom:0; margin-top:0; border-width:0;}
.tour-overlay{position:fixed; inset:0; background:rgba(20,16,10,.55); z-index:90;}
.tour-ring{position:fixed; display:none; border:2.5px solid #fff; border-radius:50%; box-shadow:0 0 0 4px rgba(255,255,255,.22); animation:tourPulse 1.3s ease-out infinite; pointer-events:none;}
.tour-ring.rect{border-radius:14px;}
.tour-tip{position:fixed; left:20px; right:20px; top:110px; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius); box-shadow:var(--glass-shadow); padding:16px; animation:fadeUp .3s ease both; -webkit-backdrop-filter:blur(24px) saturate(1.5); backdrop-filter:blur(24px) saturate(1.5);}
.tour-tip:before{content:''; position:absolute; left:36px; top:-8px; width:14px; height:14px; background:var(--card); border-left:1px solid var(--glass-border); border-top:1px solid var(--glass-border); transform:rotate(45deg);}
.tour-txt{font-size:16px; font-weight:700; color:var(--ink); line-height:1.45;}
.tour-btns{display:flex; gap:10px; margin-top:14px;}
.tour-btns .btn{flex:1; text-align:center;}
@keyframes tourPulse{0%{box-shadow:0 0 0 4px rgba(255,255,255,.35);}100%{box-shadow:0 0 0 16px rgba(255,255,255,0);}}
/* ---------- setup agreement + policy modal ---------- */
.agree-row{display:flex; align-items:center; gap:10px; width:100%; background:none; border:none; padding:10px 2px; text-align:left; font-family:inherit;}
.agree-check{width:24px; height:24px; border-radius:7px; border:2px solid var(--line-strong); background:var(--card); display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; color:#f7f3ea;}
.agree-check.on{background:var(--green); border-color:var(--green);}
.agree-check svg{width:15px; height:15px;}
.agree-txt{font-size:14.5px; color:var(--ink); line-height:1.4;}
.policyrow{text-align:center; margin:2px 0 14px;}
.policylink{background:none; border:none; padding:2px 0; font-size:13.5px; color:var(--green); text-decoration:underline; cursor:pointer; font-family:inherit;}
.modal-overlay{position:fixed; inset:0; background:rgba(10,18,32,.45); z-index:95; display:flex; align-items:center; justify-content:center; padding:24px; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);}
.modal-card{background:var(--card-glass); border:1px solid var(--glass-border); border-radius:var(--radius); box-shadow:var(--glass-shadow); padding:20px; max-width:420px; width:100%; max-height:80vh; display:flex; flex-direction:column; animation:fadeUp .3s ease both; -webkit-backdrop-filter:blur(28px) saturate(1.5); backdrop-filter:blur(28px) saturate(1.5);}

.modal-body{font-size:14px; line-height:1.7; color:var(--ink); white-space:pre-line; overflow-y:auto; margin-bottom:16px;}
.dateline{text-align:center; font-size:12.5px; color:var(--ink); font-weight:500; margin:0 0 12px;}
.setrow h3{margin:0 0 10px; font-size:15px; color:var(--green-ink);}
.seg{display:flex; gap:8px;}
.seg .btn.on{background:var(--green); border-color:var(--green); color:#f7f3ea; font-weight:700;}
.setrow .rowbtns{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
.foot{text-align:center; color:var(--ink-soft); font-size:12.5px; margin-top:18px;}
.toast{

  font-size:14px; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:50;

.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.tabbar{
  position:fixed; left:16px; right:16px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:40;
  background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:28px;
  -webkit-backdrop-filter:blur(28px) saturate(1.6); backdrop-filter:blur(28px) saturate(1.6);
  display:flex; padding:6px;
  box-shadow:var(--glass-shadow);
  transition:background-color .45s ease, border-color .45s ease;
}

.tabbar::after{content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(115deg, transparent 35%, rgba(255,255,255,.22) 48%, rgba(255,255,255,.05) 55%, transparent 70%);}
.tabbar .tab{
  position:relative; z-index:1;

.tabbar .tab.on{color:var(--clay); font-weight:700;}

#splash{position:fixed; inset:0; z-index:2000; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden;

  transition:opacity .8s ease, visibility .8s;}
#splash.done{opacity:0; visibility:hidden;}
@keyframes splashShift{from{background-position:0% 0%;} to{background-position:100% 100%;}}
.splash-glow{position:absolute; width:340px; height:340px; border-radius:50%; background:radial-gradient(circle, rgba(212,175,106,.16), transparent 70%); animation:glowPulse 3s ease-in-out infinite alternate;}
@keyframes glowPulse{from{transform:scale(.9); opacity:.7;} to{transform:scale(1.15); opacity:1;}}
.splash-inner{position:relative; text-align:center; padding:0 24px;}
.splash-logo{width:76px; height:76px; margin:0 auto 18px; border-radius:22px; background:linear-gradient(135deg,#d4af6a,#b08d3e); color:#0e2240; display:flex; align-items:center; justify-content:center; box-shadow:0 18px 40px rgba(0,0,0,.35); animation:logoIn .8s cubic-bezier(.2,.8,.3,1.2) both;}
.splash-logo svg{width:42px; height:42px;}
@keyframes logoIn{from{opacity:0; transform:scale(.6) translateY(12px);} to{opacity:1; transform:scale(1) translateY(0);}}
.splash-name{color:#f7f3ea; font-size:24px; font-weight:800; letter-spacing:1px; animation:nameIn .7s ease .35s both;}
@keyframes nameIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.splash-tag{color:rgba(247,243,234,.88); font-size:16px; margin-top:10px; min-height:24px;}
.splash-tag span{display:inline-block; animation:wordIn .6s ease both; margin-right:.35em;}
@keyframes wordIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

function icon(id){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + (ICON_PATHS[id] || '') + '</svg>';

var CATS = [
  { id:'breakfast',  color:'#b7791f', tint:'#f7ecd4' },
  { id:'lunch',      color:'#c0563c', tint:'#f7e4dc' },
  { id:'dinner',     color:'#5b6b8c', tint:'#e4e8f1' },
  { id:'transport',  color:'#a85b32', tint:'#f7e6da' },
  { id:'cigarettes', color:'#7a6a53', tint:'#efe9dc' },
  { id:'phone',      color:'#4f7a7a', tint:'#e1ecec' },
  { id:'other',      color:'#8a8a7a', tint:'#ecece2' }
];
function catById(id){
  for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i];
  return CATS[CATS.length - 1];
}
function catIcon(cat, cls){
  var c = catById(cat);
  return '<span class="catic' + (cls ? ' ' + cls : '') + '" style="background:' + c.tint + ';color:' + c.color + '">' + icon(cat) + '</span>';
}

  var q = normDigits(String(raw || '')).trim().toLowerCase().replace(/,/g, ' ').replace(/\s+/g, ' ');
  if (!q) return null;
  var y = new Date().getFullYear(), m = 0, d = 0, mm;
  mm = q.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
  if (mm){ y = +mm[1]; m = +mm[2]; d = +mm[3]; }
  else if ((mm = q.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/))){ d = +mm[1]; m = +mm[2]; y = +mm[3]; }
  else if ((mm = q.match(/^(\d{1,2})[-/.](\d{1,2})$/))){ d = +mm[1]; m = +mm[2]; }
  else if ((mm = q.match(/^([a-z\u1000-\u109f]+) (\d{1,2})(?: (\d{4}))?$/))){ m = monthNameToNum(mm[1]); d = +mm[2]; if (mm[3]) y = +mm[3]; }
  else if ((mm = q.match(/^(\d{1,2}) ([a-z\u1000-\u109f]+)(?: (\d{4}))?$/))){ d = +mm[1]; m = monthNameToNum(mm[2]); if (mm[3]) y = +mm[3]; }
  else return null;
  if (!m || m < 1 || m > 12) return null;

  if (!q) return out;
  var cur = todayISO();
  for (var i = 0; i < 370 && out.length < 8; i++){
    var iso = isoAdd(cur, i - 180);
    if (iso < MIN_ISO || iso > MAX_ISO) continue;
    if (out.indexOf(iso) !== -1) continue;
    var hay = (formatDateLong(iso) + ' ' + iso).toLowerCase();
    if (hay.indexOf(q) !== -1) out.push(iso);

/* ---------------- totals (pure) ---------------- */

}

    if (monthKeyOf(iso) !== key) continue;
    var d = state.days[iso];
    (d.entries || []).forEach(function(e){
      var a = Number(e.amount) || 0;
      exp += a;

      var e = d.entries[j];

  var t = fromISO(today || todayISO());
  var y = t.getFullYear(), m = t.getMonth() + 1, day = t.getDate();

/* ---------------- chart data (pure) ---------------- */
var DONUT_R = 34;
var DONUT_C = 2 * Math.PI * DONUT_R;
function donutSegments(byCat){
  var total = 0;
  for (var c in byCat) total += byCat[c];
  if (total <= 0) return [];
  var segs = [], offset = 0;
  CATS.forEach(function(cat){
    var amt = byCat[cat.id] || 0;
    if (amt <= 0) return;
    var frac = amt / total;
    segs.push({
      cat: cat.id, amount: amt, pct: Math.round(frac * 100),
      color: cat.color, dash: (frac * DONUT_C).toFixed(1),
      offset: (-offset * DONUT_C).toFixed(1)
    });
    offset += frac;
  });
  return segs;
}

/* ---------------- state import/export ---------------- */
/* exportState/importState used to power the file backup (removed in
   v1.1.0). They stay: cloud restore reuses importState's validation to
   apply a downloaded state, and the tests cover the round-trip. */

function importState(text){
  var s;
  try { s = JSON.parse(String(text || '')); }
  catch (e){ return { ok:false, error:'parse' }; }
  if (!s || typeof s !== 'object' || !s.setup || typeof s.setup !== 'object' ||
      !s.days || typeof s.days !== 'object') return { ok:false, error:'shape' };
  for (var iso in s.days){
    var d = s.days[iso];
    if (!d || typeof d !== 'object') return { ok:false, error:'day' };
    if (d.entries !== undefined && !Array.isArray(d.entries)) return { ok:false, error:'entries' };
    if (d.income !== undefined && !Array.isArray(d.income)) return { ok:false, error:'income' };
  }
  var next = defaultState();
  if (typeof s.setup.balance === 'number') next.setup.balance = s.setup.balance;
  if (typeof s.setup.paydayDay === 'number') next.setup.paydayDay = s.setup.paydayDay;
  if (typeof s.setup.dailyTarget === 'number') next.setup.dailyTarget = s.setup.dailyTarget;
  next.setup.done = s.setup.done === true;
  next.days = s.days;
  purgeJunk(next.days);
  if (s.settings && typeof s.settings === 'object'){
    if (s.settings.theme === 'dark' || s.settings.theme === 'light') next.settings.theme = s.settings.theme;
    if (s.settings.lang === 'my' || s.settings.lang === 'en') next.settings.lang = s.settings.lang;
    if (s.settings.tourDone === true) next.settings.tourDone = true;
    if (s.settings.guest === true) next.settings.guest = true;

  if (typeof s.lastSyncedAt === 'string') next.lastSyncedAt = s.lastSyncedAt;
  if (s.profile && typeof s.profile === 'object'){
    if (typeof s.profile.name === 'string') next.profile.name = s.profile.name.slice(0, 24);
    if (typeof s.profile.photo === 'string') next.profile.photo = s.profile.photo;

/* ---------------- accounts + cloud sync (v1.1.0) ---------------- */
/* Supabase Auth + PostgREST over plain fetch — no SDK, so the app stays

   is still placeholders, every function below is a no-op. */
var session = null; /* {access_token, refresh_token, user_id, email, expires_at} */
function loadSession(){
  try {
    var raw = storage.get(SESSION_KEY);
    if (!raw) return;
    var s = JSON.parse(raw);
    if (s && s.access_token && s.refresh_token && s.user_id) session = s;
  } catch (e) {}
}

  if (!session) return;

/* True when the login screen must gate the app: a backend is configured,

  return {
    access_token: data.access_token,
    refresh_token: data.refresh_token || '',

    return res.json().then(function(j){ return { status: res.status, ok: res.ok, body: j }; });
  });
}

  if (m.indexOf('invalid login') !== -1 || m.indexOf('invalid_grant') !== -1 ||
      m.indexOf('invalid email') !== -1) return 'authWrong';
  if (m.indexOf('email not confirmed') !== -1 ||
      m.indexOf('email_not_confirmed') !== -1) return 'authNotConfirmed';
  if (m.indexOf('is invalid') !== -1 ||
      m.indexOf('email_address_invalid') !== -1) return 'authBadEmail';
  if (m.indexOf('rate limit') !== -1 || m.indexOf('too many') !== -1) return 'authRateLimit';
  if (m.indexOf('already registered') !== -1 || m.indexOf('already exists') !== -1 ||
      m.indexOf('user already') !== -1) return 'authExists';
  if (m.indexOf('password') !== -1 && m.indexOf('short') !== -1) return 'authShortPw';
  if (m.indexOf('network') !== -1 || m.indexOf('failed to fetch') !== -1 ||

    .then(function(r){

      session = sessionFromAuth(r.body);

      return session;
    });
}

    }).then(function(){}, function(){});
  }

}
/* The OAuth implicit flow returns no user id in the hash, so fetch it
   once from /auth/v1/user. Always resolves (null on failure). */
function fetchUser(){
  if (!supabaseReady() || !session || !session.access_token) return Promise.resolve(null);
  if (typeof fetch === 'undefined') return Promise.resolve(null);
  return fetch(SUPABASE_URL + '/auth/v1/user', {
    headers: authHeaders({ 'Authorization': 'Bearer ' + session.access_token })
  })
    .then(function(res){ return res.ok ? res.json() : null; })
    .then(function(u){
      if (u && u.id){
        session.user_id = u.id;
        if (u.email) session.email = u.email;
        saveSession();
        return session;
      }
      return null;
    })

/* True inside the APK shell (the native bridge only exists there). */
function isApk(){
  if (typeof AndroidBridge !== 'undefined' && AndroidBridge) return true;
  if (typeof window !== 'undefined' && window.AndroidBridge) return true;
  return false;
}
/* The OAuth return must come back to the page the user signed in from —
   the test link and the public link are different origins, so the
   redirect is the current page (both URLs are allow-listed in
   Supabase). file:// (the APK WebView) has no usable origin, so it
   falls back to the public PWA URL. */
function oauthRedirectUrl(){
  try {
    if (typeof window !== 'undefined' && window.location && window.location.origin && window.location.origin.indexOf('http') === 0){
      return window.location.origin + (window.location.pathname || '/');
    }
  } catch (e) {}
  return PWA_URL;
}
function oauthUrl(provider){
  return SUPABASE_URL + '/auth/v1/authorize?provider=' + provider +
    '&redirect_to=' + encodeURIComponent(oauthRedirectUrl());
}
function startOAuth(provider){
  var url = oauthUrl(provider);
  /* APK: open in the system browser (the WebView cannot finish an OAuth
     redirect back into the app by itself — the deep-link return is a
     follow-up for the native shell). */
  if (typeof AndroidBridge !== 'undefined' && AndroidBridge && AndroidBridge.openExternal){
    try { AndroidBridge.openExternal(url); return; } catch (e) {}
  }
  if (typeof window !== 'undefined' && window.AndroidBridge && window.AndroidBridge.openExternal){
    try { window.AndroidBridge.openExternal(url); return; } catch (e) {}
  }
  if (typeof window !== 'undefined' && window.location){ window.location.href = url; return; }
  if (typeof window !== 'undefined' && window.open) window.open(url, '_blank');
}
/* Parses an OAuth return hash (#access_token=...&refresh_token=...&
   expires_at=...) into a session and scrubs the tokens from the URL. */
function parseOAuthReturn(){
  if (typeof window === 'undefined' || !window.location) return false;
  var hash = window.location.hash || '';
  if (hash.indexOf('access_token=') === -1) return false;
  var params = {};
  hash.replace(/^#/, '').split('&').forEach(function(pair){
    var kv = pair.split('=');
    if (kv[0]){
      try { params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || ''); }
      catch (e) { params[kv[0]] = kv[1] || ''; }
    }
  });
  if (!params.access_token || !params.refresh_token) return false;
  session = {
    access_token: params.access_token,
    refresh_token: params.refresh_token,
    user_id: params.user_id || '',
    email: params.email || '',
    expires_at: params.expires_at ? Number(params.expires_at) * 1000 : Date.now() + 3600000
  };
  saveSession();
  try {
    if (window.history && window.history.replaceState){
      window.history.replaceState(null, '', window.location.pathname || '/');
    }
  } catch (e) {}
  return true;
}
/* After any successful auth: finish the session, restore from the cloud,
   then land on setup (new user) or home. */
function afterAuth(){
  loginBusy = false;
  loginDraft = { email:'', password:'' };
  return syncDownOnStart().then(function(res){
    if (res === 'applied') showToast(t('authRestored'));

    if (state.setup.done) goHome(false);
    else { view = { name:'setup', iso: clampISO(todayISO()) }; render(); }
  });
}

}

/* ---------------- cloud sync ---------------- */
/* One row per user in the wallet_data table (user_id uuid PK, data jsonb,
   updated_at timestamptz). Last-write-wins by updated_at. A failed
   download NEVER wipes local data — the local copy is the truth. */
function uploadState(){
  if (!supabaseReady() || !session) return Promise.resolve({ ok:false, reason:'no-session' });
  return ensureFreshToken().then(function(){
    var row = {
      user_id: session.user_id,
      data: state,
      updated_at: new Date().toISOString()
    };
    return fetch(SUPABASE_URL + '/rest/v1/wallet_data?on_conflict=user_id', {
      method: 'POST',
      headers: authHeaders({
        'Authorization': 'Bearer ' + session.access_token,
        'Prefer': 'resolution=merge-duplicates'
      }),
      body: JSON.stringify(row)
    }).then(function(res){
      if (!res.ok) throw new Error('HTTP ' + res.status);
      state.lastSyncedAt = row.updated_at;
      persist(true);
      return { ok:true };
    });
  }).catch(function(e){
    return { ok:false, reason:'network', error: String(e && e.message || e) };
  });
}
function downloadState(){
  if (!supabaseReady() || !session) return Promise.resolve(null);
  return ensureFreshToken().then(function(){
    return fetch(SUPABASE_URL + '/rest/v1/wallet_data?user_id=eq.' +
      encodeURIComponent(session.user_id) + '&select=data,updated_at', {
      headers: authHeaders({ 'Authorization': 'Bearer ' + session.access_token })
    }).then(function(res){
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(rows){
      if (!rows || !rows.length) return null;
      return rows[0];
    });
  });
}
/* Applies a downloaded row when it is newer than the local copy.
   Returns 'applied' | 'skipped' | 'empty' | 'bad'. */
function applyRemoteIfNewer(row){
  if (!row || !row.data) return 'empty';
  var remoteTs = row.updated_at || '';
  var localTs = state.lastSyncedAt || '';
  if (remoteTs && localTs && remoteTs <= localTs) return 'skipped';
  var r = importState(JSON.stringify(row.data));
  if (!r.ok) return 'bad';
  state.lastSyncedAt = remoteTs || new Date().toISOString();
  persist(true);
  return 'applied';
}
/* Download once (login / app start). No remote row + local data means
   this device is the first one — push local up instead. */
function syncDownOnStart(){
  if (!supabaseReady() || !session) return Promise.resolve('skip');
  return downloadState().then(function(row){
    if (!row){
      if (state.setup.done || Object.keys(state.days || {}).length){
        return uploadState().then(function(){ return 'uploaded'; });
      }
      return 'empty';
    }
    var res = applyRemoteIfNewer(row);
    if (res === 'applied') render();
    return res;
  }).catch(function(){ return 'failed'; });
}

/* A zero-amount entry with no note carries no information — it is an
   accidental chip tap. */
function isJunk(e){ return (Number(e.amount) || 0) <= 0 && !(e.note || '').trim(); }
function purgeJunk(days){
  var removed = 0;
  if (!days || typeof days !== 'object') return removed;
  for (var iso in days){
    var d = days[iso];
    if (!d || typeof d !== 'object') continue;
    if (Array.isArray(d.entries)){
      var before = d.entries.length;
      d.entries = d.entries.filter(function(e){ return !isJunk(e); });
      removed += before - d.entries.length;
    }
    if (Array.isArray(d.income)){
      var beforeI = d.income.length;
      d.income = d.income.filter(function(r){ return !isJunk(r); });
      removed += beforeI - d.income.length;
    }
    if ((!d.entries || !d.entries.length) && (!d.income || !d.income.length)) delete days[iso];
  }
  return removed;
}

/* Animated count-up for dashboard numbers (no-op without a real DOM). */
function animateCountUps(){
  if (typeof document === 'undefined' || !document.querySelectorAll) return;
  var nodes = document.querySelectorAll('[data-countup]');
  for (var i = 0; i < nodes.length; i++){
    (function(node){
      var target = Number(node.getAttribute('data-countup')) || 0;
      if (typeof requestAnimationFrame === 'undefined'){ node.textContent = fmt(target); return; }
      var start = null, dur = 600;
      node.textContent = '0';
      function step(ts){
        if (!start) start = ts;
        var p = Math.min(1, (ts - start) / dur);
        var eased = 1 - Math.pow(1 - p, 3);
        node.textContent = fmt(Math.round(target * eased));
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    })(nodes[i]);
  }
}

   on every render — to still SEE it slide, the old pixel position is
   passed in (FLIP): the new glide starts there with no transition, then
   transitions to its new spot. */
function positionTabGlide(fromLeft){
  if (typeof document === 'undefined' || !document.querySelector) return;
  try {
    var glide = document.querySelector('.tab-glide');
    var on = document.querySelector('.tabbar .tab.on');

    var left = on.offsetLeft + 4;

      glide.style.transition = 'none';
      glide.style.left = fromLeft + 'px';
      glide.style.width = width + 'px';
      void glide.offsetWidth;
      glide.style.transition = '';

    glide.style.left = left + 'px';
    glide.style.width = width + 'px';
  } catch (e) {}

  var target = (typeof document !== 'undefined' && document.querySelector) ? document.querySelector(sel) : null;
  var rect = (target && target.getBoundingClientRect) ? target.getBoundingClientRect() : null;

/* ---------------- render + navigation ---------------- */
/* PC drag-to-scroll for the category chips (v1.1.5): on a desktop there
   is no touch swipe and the scrollbar is hidden, so the last categories
   (phone, other) were unreachable — after transport/cigarettes the row
   just stopped. Mouse-drag scrolls it; a real drag swallows the click
   that would otherwise fire on release, so dragging never opens a draft. */
var chipDrag = { on: false, moved: false, x: 0, left: 0 };
function initChipDrag(){
  var cr = el('chipRow');
  if (!cr || !cr.addEventListener || cr._dragWired) return;
  cr._dragWired = true;
  cr.addEventListener('pointerdown', function(e){
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    chipDrag.on = true; chipDrag.moved = false;
    chipDrag.x = e.clientX; chipDrag.left = cr.scrollLeft;
    if (cr.setPointerCapture){ try { cr.setPointerCapture(e.pointerId); } catch (err) {} }
  });
  cr.addEventListener('pointermove', function(e){
    if (!chipDrag.on) return;
    var dx = e.clientX - chipDrag.x;
    if (!chipDrag.moved && Math.abs(dx) > 6){
      chipDrag.moved = true;
      if (cr.classList) cr.classList.add('dragging');
    }
    if (chipDrag.moved) cr.scrollLeft = chipDrag.left - dx;
  });
  function chipDragEnd(){
    if (!chipDrag.on) return;
    chipDrag.on = false;
    if (cr.classList) cr.classList.remove('dragging');
  }
  cr.addEventListener('pointerup', chipDragEnd);
  cr.addEventListener('pointercancel', chipDragEnd);
  cr.addEventListener('pointerleave', chipDragEnd);
  cr.addEventListener('click', function(e){
    if (chipDrag.moved){ chipDrag.moved = false; e.stopPropagation(); e.preventDefault(); }
  }, true);
}
function render(){
  applyTheme();
  var root = el('app');
  if (!root) return;
  /* Preserve the category chips' horizontal scroll position across the
     re-render, so tapping a chip does not snap the row back to the start. */
  var chipScroll = 0;
  var cr0 = el('chipRow');
  if (cr0 && typeof cr0.scrollLeft === 'number') chipScroll = cr0.scrollLeft;
  /* The tab glide's old position, so it can slide (FLIP) instead of jump. */
  var oldGlideLeft = null;
  var og = (typeof document !== 'undefined' && document.querySelector) ? document.querySelector('.tab-glide') : null;
  if (og && og.style && og.style.left) oldGlideLeft = parseFloat(og.style.left);
  var key = view.name + '|' + (view.iso || '');
  var newView = (key !== lastViewKey);
  /* First-run tour: start it the first time a finished setup lands on home. */
  if (view.name === 'home' && state.setup.done && !needsLogin() && !(state.settings && state.settings.tourDone) && tourStep === null) tourStep = 0;
  var html;
  /* The login gate overrides every view: while it applies, no other
     screen can be reached by any navigation path. */
  if (view.name === 'login' || needsLogin()) html = loginViewHTML();
  else if (!state.setup.done) html = setupViewHTML();
  else if (view.name === 'home') html = homeViewHTML();
  else if (view.name === 'settings') html = settingsViewHTML();
  else html = dayViewHTML();
  /* The view slides/fades in on its own wrapper. The animation's transform
     must NOT sit on #app: any transformed ancestor breaks position:fixed,
     which is what left the tab bar scrolling away with the page. The tab
     bar, FAB, tour and modals are siblings of the wrapper, so they stay
     pinned to the viewport on every view. */
  /* The view fades + rises in on every navigation — but from 30% opacity,
     never from invisible: during rapid tab taps the old from-0 fade
     restarted from transparent every time, so the screen looked blank and
     stuck. From 30% the content is always visible and the feel stays.
     Arrow day-changes skip the fade: the day content slides sideways
     instead (see dayViewHTML). */
  var enterCls = (newView && !slideDir) ? ' view-enter' : '';
  html = '<div class="view-body' + enterCls + '" id="viewBody">' + html + '</div>';
  slideDir = null;
  if (view.name === 'home' && state.setup.done && !needsLogin()) html += '<button type="button" class="fab" data-action="fab-add">+</button>';
  html += tabbarHTML();
  if (tourStep !== null && view.name === 'home' && state.setup.done && !needsLogin()) html += tourHTML();
  if (policyOpen) html += policyModalHTML();
  if (exitOpen) html += exitModalHTML();
  root.innerHTML = html;
  /* New view: start at the top of the page. Without this, tapping Start
     low on the long setup form leaves home scrolled down, so the tour
     ring lands off-screen above the profile header. */
  if (newView && typeof window !== 'undefined' && window.scrollTo) window.scrollTo(0, 0);
  positionTour();
  positionTabGlide(oldGlideLeft);
  var cr1 = el('chipRow');
  if (cr1 && typeof cr1.scrollLeft === 'number') cr1.scrollLeft = chipScroll;
  initChipDrag();
  if (editingName){
    var ni = el('nameInput');
    if (ni && ni.focus){ ni.focus(); if (ni.select) ni.select(); }
  }
  if (newView) lastViewKey = key;
  /* Count-ups only when the view itself changes: replaying them on every
     re-render (theme toggle, save, ...) makes the numbers flicker from 0. */
  if (newView && view.name === 'home' && state.setup.done) animateCountUps();
}
function setHash(hash, push){
  if (typeof window === 'undefined' || !window.history) return;
  try {
    if (push) window.history.pushState(null, '', hash);
    else window.history.replaceState(null, '', hash);
  } catch (e) {}
}
function goHome(push){
  view = { name:'home', iso: clampISO(todayISO()) };
  setHash('#home', push === true);
  render();
}
function goToDay(iso, push){
  var next = clampISO(iso);
  if (draft && draft.iso !== next) draft = null;
  view = { name:'day', iso: next };
  setHash('#day=' + view.iso, push === true);
  render();
}
function goToSettings(push){
  view = { name:'settings', iso: view.iso };
  setHash('#settings', push === true);
  render();
}
function goToLogin(push){
  view = { name:'login', iso: view.iso };
  setHash('#login', push === true);
  render();
}
function onHashChange(){
  var hash = (typeof window !== 'undefined' && window.location) ? window.location.hash : '';
  /* An OAuth return landing on an already-open app (rare — the return is
     normally a fresh load handled by init). */
  if (hash.indexOf('access_token=') !== -1){
    if (parseOAuthReturn()) handleOAuthReturn();
    return;
  }
  if (hash === '#login') view = { name:'login', iso: view.iso };
  else if (hash === '#settings') view = { name:'settings', iso: view.iso };
  else if (hash === '#home') view = { name:'home', iso: clampISO(todayISO()) };
  else {
    var m = hash.match(/^#day=(\d{4}-\d{2}-\d{2})$/);
    view = { name:'day', iso: m ? clampISO(m[1]) : clampISO(todayISO()) };
  }
  if (draft && view.name === 'day' && draft.iso !== view.iso) draft = null;
  render();
}
/* Android Back button: MainActivity delegates every press here, and tab
   navigation never pushes history, so Back never walks through the views
   the user tapped through. Day/settings go home; home asks before exit. */
function handleBack(){
  if (exitOpen){ exitOpen = false; render(); return; }
  if (policyOpen){ policyOpen = false; render(); return; }
  if (tourStep !== null){ endTour(); return; }
  /* Login as a gate (no session, not guest): Back asks before exit —
     there is nowhere else to go. A guest who opened login from Settings
     just goes back home instead. */
  if (needsLogin()){ exitOpen = true; render(); return; }
  if (view.name === 'login'){ goHome(false); return; }
  if (view.name === 'home'){ exitOpen = true; render(); return; }
  goHome(false);
}

/* Downscale a picked photo to max 256px (JPEG) so the profile picture
   stays small in localStorage. Calls done(dataUrl) or done(null). */
function downscalePhoto(dataUrl, done){
  if (typeof Image === 'undefined' || typeof document === 'undefined' || !document.createElement){ done(dataUrl); return; }
  var img = new Image();
  img.onload = function(){
    try {
      var max = 256, w = img.width, h = img.height;
      if (!w || !h || (w <= max && h <= max)){ done(dataUrl); return; }
      var s = Math.min(max / w, max / h);
      var cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(w * s));
      cv.height = Math.max(1, Math.round(h * s));
      var ctx = cv.getContext ? cv.getContext('2d') : null;
      if (!ctx){ done(dataUrl); return; }
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      done(cv.toDataURL('image/jpeg', 0.8));
    } catch (e){ done(dataUrl); }
  };
  img.onerror = function(){ done(null); };
  img.src = dataUrl;
}
